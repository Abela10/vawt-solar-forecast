[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosolar"
version = "0.1.0"
description = "AeroSolar Twin: VAWT + PV digital twin, predictive maintenance and live dashboard"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["aerosolar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
